version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alwadi-zatca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: alwadi_zatca_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alwadi_zatca_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alwadi-zatca-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alwadi-zatca-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/alwadi_zatca_local?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "local_docker_jwt_secret_alwadi_2026"
      ZATCA_ENV: "SANDBOX"
      COMPANY_REGISTERED_NAME: "Alwadi Trading L.L.C."
      ALLOWED_USER_DOMAINS: "alwadi.sa,alwadi.com,system.local"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alwadi-zatca-worker
    command: ["npx", "tsx", "server/src/worker.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/alwadi_zatca_local?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "local_docker_jwt_secret_alwadi_2026"
      ZATCA_ENV: "SANDBOX"
      COMPANY_REGISTERED_NAME: "Alwadi Trading L.L.C."
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
