
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZATCA Fatoora Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: #0f172a;
      }
      input, textarea, select, button {
        font-family: 'Inter', sans-serif;
      }

      /* Custom Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; /* slate-300 */
        border-radius: 3px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; /* slate-400 */
      }

      /* Firefox Support */
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }

      /* Dark Scrollbar Variant for Sidebar */
      .dark-scroll::-webkit-scrollbar-thumb {
        background: #334155; /* slate-700 */
      }
      
      .dark-scroll::-webkit-scrollbar-thumb:hover {
        background: #475569; /* slate-600 */
      }
      
      .dark-scroll {
        scrollbar-color: #334155 transparent;
      }

      /* HTML5-QRCode Scanner Overrides */
      #reader * {
        color: #e2e8f0 !important; /* Force light text */
      }
      
      #reader a {
        color: #6366f1 !important; /* Indigo-500 for links */
        text-decoration: none;
      }
      
      #reader a:hover {
        color: #818cf8 !important; /* Indigo-400 on hover */
        text-decoration: underline;
      }
      
      #reader button {
        background-color: #4f46e5 !important; /* Indigo-600 */
        color: white !important;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      #reader button:hover {
        background-color: #4338ca !important; /* Indigo-700 */
      }
      
      #reader select {
        background-color: #1e293b; /* Slate-800 */
        color: white;
        border: 1px solid #334155; /* Slate-700 */
        border-radius: 0.375rem;
        padding: 0.25rem;
      }
    </style>
  <script type="importmap">

  }
}
</script>

</head>
